name: Publish as ITB test suites
on: [push]
jobs:
  Publish_to_staging:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Run the sctipt
        uses: GovstackWorkingGroup/itb-integration@e361dee44204d6ddfc862d8dbe7e56dfdde870d9
        with:
          src-path: ./src/
          itb-url: https://testbed-staging.govstack.global/api/rest
          itb-org-key: ${{ secrets.ITB_STAGING_ORG_KEY }}
          itb-group-key: ${{ secrets.ITB_STAGING_GROUP_KEY }}
          itb-domain-key: ${{ secrets.ITB_STAGING_DOMAIN_KEY }}
